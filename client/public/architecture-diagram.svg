<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ZONES (transparent canvas; tinted panels) -->
  <rect x="50" y="50" width="300" height="130" rx="14" fill="#0284c7" fill-opacity="0.07" stroke="#0284c7" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6,5"/>
  <rect x="450" y="50" width="300" height="130" rx="14" fill="#9333ea" fill-opacity="0.07" stroke="#9333ea" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6,5"/>
  <rect x="50" y="320" width="350" height="280" rx="14" fill="#16a34a" fill-opacity="0.07" stroke="#16a34a" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6,5"/>
  <rect x="450" y="475" width="300" height="125" rx="14" fill="#ea580c" fill-opacity="0.07" stroke="#ea580c" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6,5"/>
  <rect x="800" y="320" width="350" height="280" rx="14" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- ZONE TITLE PILLS -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="66" y="36" width="124" height="28" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="128" y="55" fill="#0369a1">Edge Devices</text>

    <rect x="466" y="36" width="204" height="28" rx="14" fill="#f3e8ff" stroke="#9333ea"/>
    <text x="568" y="55" fill="#7e22ce">ZegoCloud Architecture</text>

    <rect x="66" y="306" width="252" height="28" rx="14" fill="#dcfce7" stroke="#16a34a"/>
    <text x="192" y="325" fill="#15803d">AI Inference Engine (Python)</text>

    <rect x="466" y="461" width="172" height="28" rx="14" fill="#ffedd5" stroke="#ea580c"/>
    <text x="552" y="480" fill="#c2410c">Node.js API Server</text>

    <rect x="816" y="306" width="212" height="28" rx="14" fill="#e2e8f0" stroke="#475569"/>
    <text x="922" y="325" fill="#334155">Admin Dashboard (React)</text>
  </g>

  <!-- CONNECTIONS -->
  <!-- Camera -> WebRTC -->
  <path d="M 335 125 L 463 125" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <!-- WebRTC -> AI -->
  <path d="M 560 157 C 560 260, 225 260, 225 358" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <!-- WebRTC -> React -->
  <path d="M 640 157 C 640 260, 975 260, 975 358" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <!-- AI internal flow -->
  <path d="M 225 412 L 225 435" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <path d="M 225 487 L 225 528" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <!-- AI -> React (boxes) -->
  <path d="M 385 462 L 813 462" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6,5" marker-end="url(#arrow-blue)"/>
  <!-- AI -> Node (alerts) -->
  <path d="M 385 555 L 463 555" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <!-- Node -> React (SSE) -->
  <path d="M 735 555 L 813 555" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <!-- CONNECTION LABEL PILLS -->
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="346" y="95" width="108" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="400" y="110" fill="#475569">Publishes Video</text>

    <rect x="318" y="249" width="150" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="393" y="264" fill="#475569">Extracts Frames (8 FPS)</text>

    <rect x="737" y="249" width="140" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="807" y="264" fill="#475569">Native Video (30 FPS)</text>


    <rect x="500" y="451" width="200" height="22" rx="11" fill="#ffffff" stroke="#93c5fd"/>
    <text x="600" y="466" fill="#2563eb">WebSocket (JSON SVG Boxes)</text>

    <rect x="387" y="522" width="74" height="22" rx="11" fill="#ffffff" stroke="#fca5a5"/>
    <text x="424" y="537" fill="#dc2626">POST /alerts</text>

    <rect x="740" y="522" width="70" height="22" rx="11" fill="#ffffff" stroke="#fca5a5"/>
    <text x="775" y="537" fill="#dc2626">SSE Push</text>
  </g>

  <!-- NODE CARDS -->
  <g filter="url(#shadow)">
    <rect x="65" y="95" width="270" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="465" y="95" width="270" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

    <rect x="65" y="360" width="320" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="65" y="437" width="320" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="65" y="530" width="320" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

    <rect x="465" y="530" width="270" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

    <rect x="815" y="360" width="320" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="815" y="437" width="320" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="815" y="530" width="320" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>

  <!-- CARD ACCENT DOTS -->
  <circle cx="84" cy="125" r="5" fill="#0284c7"/>
  <circle cx="484" cy="125" r="5" fill="#9333ea"/>
  <circle cx="84" cy="386" r="5" fill="#16a34a"/>
  <circle cx="84" cy="462" r="5" fill="#16a34a"/>
  <circle cx="84" cy="555" r="5" fill="#16a34a"/>
  <circle cx="484" cy="555" r="5" fill="#ea580c"/>
  <circle cx="834" cy="386" r="5" fill="#475569"/>
  <circle cx="834" cy="462" r="5" fill="#475569"/>
  <circle cx="834" cy="555" r="5" fill="#475569"/>

  <!-- CARD TEXT -->
  <g fill="#1e293b" font-size="14" font-weight="600">
    <text x="100" y="130">Smartphone / IP Camera</text>
    <text x="500" y="130">WebRTC Server</text>

    <text x="100" y="391">FastAPI WebSocket Receiver</text>
    <text x="100" y="467">Gatekeeper: YOLOv8 Person Tracker</text>
    <text x="100" y="560">Heavy Model: PPE &amp; Hazard Detector</text>

    <text x="500" y="560">Express Server &amp; PostgreSQL</text>

    <text x="850" y="391">Zego WebRTC Video Player</text>
    <text x="850" y="467">Zero-Latency SVG Bounding Boxes</text>
    <text x="850" y="560">Real-Time Alerts Panel</text>
  </g>
</svg>
