<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%" style="background: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- BACKGROUND SECTIONS -->
  
  <!-- Edge Devices -->
  <rect x="50" y="50" width="300" height="130" rx="12" fill="rgba(2, 132, 199, 0.05)" stroke="rgba(2, 132, 199, 0.3)" stroke-width="2" stroke-dasharray="6,4" />
  <text x="65" y="75" fill="#0284c7" font-weight="700" font-size="16">Edge Devices</text>

  <!-- ZegoCloud Infrastructure -->
  <rect x="450" y="50" width="300" height="130" rx="12" fill="rgba(147, 51, 234, 0.05)" stroke="rgba(147, 51, 234, 0.3)" stroke-width="2" stroke-dasharray="6,4" />
  <text x="465" y="75" fill="#9333ea" font-weight="700" font-size="16">ZegoCloud Architecture</text>

  <!-- AI Engine (Python) -->
  <rect x="50" y="320" width="350" height="280" rx="12" fill="rgba(22, 163, 74, 0.05)" stroke="rgba(22, 163, 74, 0.3)" stroke-width="2" stroke-dasharray="6,4" />
  <text x="65" y="345" fill="#16a34a" font-weight="700" font-size="16">AI Inference Engine (Python)</text>

  <!-- Node.js Backend -->
  <rect x="450" y="475" width="300" height="125" rx="12" fill="rgba(234, 88, 12, 0.05)" stroke="rgba(234, 88, 12, 0.3)" stroke-width="2" stroke-dasharray="6,4" />
  <text x="465" y="500" fill="#ea580c" font-weight="700" font-size="16">Node.js API Server</text>

  <!-- React Dashboard -->
  <rect x="800" y="320" width="350" height="280" rx="12" fill="rgba(71, 85, 105, 0.05)" stroke="rgba(71, 85, 105, 0.3)" stroke-width="2" stroke-dasharray="6,4" />
  <text x="815" y="345" fill="#475569" font-weight="700" font-size="16">Admin Dashboard (React)</text>


  <!-- CONNECTION LINES -->
  
  <!-- Camera to Zego -->
  <path d="M 320 125 L 460 125" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)" />
  <text x="390" y="115" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle">Publishes Video</text>

  <!-- Zego to AI -->
  <path d="M 550 160 C 550 260, 225 260, 225 365" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)" />
  <text x="360" y="240" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle">Extracts Frames (8 FPS)</text>

  <!-- Zego to React -->
  <path d="M 640 160 C 640 260, 975 260, 975 365" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)" />
  <text x="840" y="240" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle">Native Video (30 FPS)</text>

  <!-- AI to React (Bounding Boxes) -->
  <path d="M 380 455 L 810 455" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-blue)" />
  <text x="600" y="445" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">WebSocket (JSON SVG Boxes)</text>

  <!-- AI to Node (Alerts) -->
  <path d="M 380 550 L 460 550" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="420" y="540" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle">POST /alerts</text>

  <!-- Node to React (SSE) -->
  <path d="M 720 550 L 810 550" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="765" y="540" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle">SSE Push</text>


  <!-- NODES -->

  <!-- Camera Box -->
  <rect x="70" y="95" width="250" height="60" rx="8" fill="#ffffff" filter="url(#shadow)" />
  <text x="195" y="130" fill="#1e293b" font-weight="600" font-size="14" text-anchor="middle">Smartphone / IP Camera</text>

  <!-- Zego Box -->
  <rect x="470" y="95" width="250" height="60" rx="8" fill="#ffffff" filter="url(#shadow)" />
  <text x="595" y="130" fill="#1e293b" font-weight="600" font-size="14" text-anchor="middle">WebRTC Server</text>

  <!-- AI Modules -->
  <rect x="70" y="365" width="310" height="50" rx="8" fill="#ffffff" filter="url(#shadow)" />
  <text x="225" y="395" fill="#1e293b" font-weight="600" font-size="14" text-anchor="middle">FastAPI WebSocket Receiver</text>

  <rect x="70" y="430" width="310" height="50" rx="8" fill="#ffffff" filter="url(#shadow)" />
  <text x="225" y="460" fill="#1e293b" font-weight="600" font-size="14" text-anchor="middle">Gatekeeper: YOLOv8 Person Tracker</text>

  <rect x="70" y="525" width="310" height="50" rx="8" fill="#ffffff" filter="url(#shadow)" />
  <text x="225" y="555" fill="#1e293b" font-weight="600" font-size="14" text-anchor="middle">Heavy Model: PPE &amp; Hazard Detector</text>

  <!-- Node Modules -->
  <rect x="470" y="525" width="250" height="50" rx="8" fill="#ffffff" filter="url(#shadow)" />
  <text x="595" y="555" fill="#1e293b" font-weight="600" font-size="14" text-anchor="middle">Express Server &amp; PostgreSQL</text>

  <!-- React Modules -->
  <rect x="820" y="365" width="310" height="50" rx="8" fill="#ffffff" filter="url(#shadow)" />
  <text x="975" y="395" fill="#1e293b" font-weight="600" font-size="14" text-anchor="middle">Zego WebRTC Video Player</text>

  <rect x="820" y="430" width="310" height="50" rx="8" fill="#ffffff" filter="url(#shadow)" />
  <text x="975" y="460" fill="#1e293b" font-weight="600" font-size="14" text-anchor="middle">Zero-Latency SVG Bounding Boxes</text>

  <rect x="820" y="525" width="310" height="50" rx="8" fill="#ffffff" filter="url(#shadow)" />
  <text x="975" y="555" fill="#1e293b" font-weight="600" font-size="14" text-anchor="middle">Real-Time Alerts Panel</text>

</svg>
